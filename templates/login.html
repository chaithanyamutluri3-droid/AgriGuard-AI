<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriGuard AI | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

background:
linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url("{{ url_for('static', filename='images/agriculture.jpg') }}");

background-size:cover;
background-position:center;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

font-family:Arial, Helvetica, sans-serif;

}

.login-box{

width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.4);

}

h2{

text-align:center;
color:#198754;
margin-bottom:30px;
font-weight:bold;

}

.form-control{

height:45px;

}

.btn-success{

width:100%;
height:45px;
font-size:18px;

}

.register-link{

text-align:center;
margin-top:20px;

}

.register-link a{

text-decoration:none;
font-weight:bold;

}

.register-link a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-box">

<h2>🌾 AgriGuard AI Login</h2>

<form action="/login" method="POST">

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-4">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<button type="submit" class="btn btn-success">

Login

</button>

<div class="register-link">

<p>
Don't have an account?
<a href="/register">Create New Account</a>
</p>

</div>

</form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriGuard AI | IoT Sensor Monitoring</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#e8f5e9;
    font-family:Arial, Helvetica, sans-serif;
}

.navbar{
    background:#198754;
}

.navbar-brand{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.navbar-brand:hover{
    color:white;
}

.container{
    margin-top:40px;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card-title{
    color:#198754;
    font-weight:bold;
}

.value{
    font-size:35px;
    color:#0d6efd;
    font-weight:bold;
}

.btn-success{
    width:100%;
    font-size:18px;
}

footer{
    background:#198754;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

</style>

</head>

<body>

<nav class="navbar">
<div class="container-fluid">
<a class="navbar-brand" href="/dashboard">🌾 AgriGuard AI</a>
</div>
</nav>

<div class="container">

<h2 class="text-center text-success mb-4">
📡 IoT Sensor Monitoring
</h2>

<div class="row g-4">

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">🌡 Temperature</h5>
<div id="temp" class="value">-- °C</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">💧 Soil Moisture</h5>
<div id="moisture" class="value">-- %</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">💨 Humidity</h5>
<div id="humidity" class="value">-- %</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">☀️ Light Intensity</h5>
<div id="light" class="value">-- Lux</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">🚰 Water Level</h5>
<div id="water" class="value">-- %</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h5 class="card-title">🔋 Battery Status</h5>
<div id="battery" class="value">-- %</div>
</div>
</div>

</div>

<div class="mt-5">

<button class="btn btn-success" onclick="updateSensors()">
Refresh Sensor Values
</button>

</div>

</div>

<footer>

<h5>🌾 AgriGuard AI</h5>

<p>
AI • IoT • Semiconductor Sensor Technology • Green Chemistry
</p>

<p>
❤️ Smart Farming for Sustainable Agriculture ❤️
</p>

</footer>

<script>

function random(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function updateSensors(){

document.getElementById("temp").innerHTML=random(20,40)+" °C";

document.getElementById("moisture").innerHTML=random(30,100)+" %";

document.getElementById("humidity").innerHTML=random(40,95)+" %";

document.getElementById("light").innerHTML=random(1000,9000)+" Lux";

document.getElementById("water").innerHTML=random(20,100)+" %";

document.getElementById("battery").innerHTML=random(50,100)+" %";

}

window.onload=updateSensors;

</script>

</body>
</html>s
